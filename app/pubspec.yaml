name: mototalk
description: MotoTalk - PTT Voice Communication for Motorcyclists
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # WebRTC
  flutter_webrtc: ^0.12.0
  
  # WebSocket
  socket_io_client: ^2.0.3+1
  
  # HTTP
  http: ^1.1.0
  
  # Audio session (interruption / device change); ducking via native AudioFocus
  audio_session: ^0.1.18
  
  # Speech Recognition
  speech_to_text: ^7.0.0
  
  # Permissions
  permission_handler: ^11.0.1
  
  # State Management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # UI
  flutter_animate: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/audio/
